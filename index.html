    </tr>
    <tr class="advanced">

        <td class="season flow">True:<br><strong><span class="tru wintertrue">-</span></strong></td>

        <td class="season flow">True:<br><strong><span class="tru summertrue">-</span></strong></td>

    <tr class="advanced">
        <td class="season flow">Dark:<br><strong><span class="dark">-</span></strong></td>
        <td class="season flow">Bright:<br><strong><span class="bright">-</span></strong></td>
        <td class="season flow">Light:<br><strong><span class="light">-</span></strong></td>
        <td class="season flow">Soft:<br><strong><span class="soft">-</span></strong></td>
    </tr>
 </table>
