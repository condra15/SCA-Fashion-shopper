<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style/style.css" type="text/css">
  <link rel="stylesheet" href="style/popup-size.css" type="text/css">
  <link rel="stylesheet" href="style/analyze.css" type="text/css">
  <script type="module" src="js/script.js"></script>
</head>
<body>
  <header>
    <nav>
      <ul class="nav">
        <li><a href="index.html" class="active">Analyze</a></li>
        <li><a href="pages/tutorial.html">Tutorial</a></li>
        <li><a href="pages/about.html">My Season</a></li>
        <li><a href="pages/login.html">Account</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h1 class="heading">Color Season <em>Finder</em></h1>

    <div class="controls-row">
      <select id="seasonSelect" class="pick compact-pick">
        <option value="" disabled selected>Select season</option>
        <option value="Bright Spring">Bright Spring</option>
        <option value="True Spring">True Spring</option>
        <option value="Light Spring">Light Spring</option>
        <option value="Light Summer">Light Summer</option>
        <option value="True Summer">True Summer</option>
        <option value="Soft Summer">Soft Summer</option>
        <option value="Soft Autumn">Soft Autumn</option>
        <option value="True Autumn">True Autumn</option>
        <option value="Dark Autumn">Dark Autumn</option>
        <option value="Dark Winter">Dark Winter</option>
        <option value="True Winter">True Winter</option>
        <option value="Bright Winter">Bright Winter</option>
      </select>
      <button id="dropperBtn" class="find compact-find">FIND COLOR SEASON</button>
      <span id="counter" class="counter-label">5/5 uses</span>
    </div>

    <button id="upgradeBtn" class="upgrade-cta" style="display: none;">Upgrade for Unlimited Uses</button>

    <div id="result-box" class="result-box">
      <div class="result-content">
        <div class="result-text">
          <div id="result-rating" class="result-rating"></div>
          <div id="result-season" class="result-season"></div>
        </div>
        <div id="result-hex" class="result-hex"></div>
      </div>
      <div id="result-empty" class="result-empty">Pick a color to analyze</div>
    </div>

    <!-- Consent banner mounts here (js/consent-banner.js) — below the whole
         pick-analyze-result flow so it never sits between the button and its
         result, and above only the decorative wheel. -->
    <div id="consent-banner-root"></div>

    <div class="wheel-wrap">
      <svg id="season-wheel" viewBox="-20 -20 200 200" width="240" height="240">
        <g transform="translate(80,80)">
          <path id="seg-0" d="M0,-78 A78,78 0 0,1 39,-67.55 L0,0Z" fill="#FF6F61" opacity="0.65"/>
          <path id="seg-1" d="M39,-67.55 A78,78 0 0,1 67.55,-39 L0,0Z" fill="#FFB830" opacity="0.65"/>
          <path id="seg-2" d="M67.55,-39 A78,78 0 0,1 78,0 L0,0Z" fill="#FFDAB3" opacity="0.65"/>
          <path id="seg-3" d="M78,0 A78,78 0 0,1 67.55,39 L0,0Z" fill="#A8C8E8" opacity="0.65"/>
          <path id="seg-4" d="M67.55,39 A78,78 0 0,1 39,67.55 L0,0Z" fill="#C4A0B0" opacity="0.65"/>
          <path id="seg-5" d="M39,67.55 A78,78 0 0,1 0,78 L0,0Z" fill="#B0A8C0" opacity="0.65"/>
          <path id="seg-6" d="M0,78 A78,78 0 0,1 -39,67.55 L0,0Z" fill="#C4B08C" opacity="0.65"/>
          <path id="seg-7" d="M-39,67.55 A78,78 0 0,1 -67.55,39 L0,0Z" fill="#C07040" opacity="0.65"/>
          <path id="seg-8" d="M-67.55,39 A78,78 0 0,1 -78,0 L0,0Z" fill="#7A6030" opacity="0.65"/>
          <path id="seg-9" d="M-78,0 A78,78 0 0,1 -67.55,-39 L0,0Z" fill="#3C3060" opacity="0.65"/>
          <path id="seg-10" d="M-67.55,-39 A78,78 0 0,1 -39,-67.55 L0,0Z" fill="#4060A8" opacity="0.65"/>
          <path id="seg-11" d="M-39,-67.55 A78,78 0 0,1 0,-78 L0,0Z" fill="#D03070" opacity="0.65"/>

          <line x1="0" y1="-78" x2="0" y2="-32" stroke="rgba(44,31,46,0.2)" stroke-width="1"/>
          <line x1="78" y1="0" x2="32" y2="0" stroke="rgba(44,31,46,0.2)" stroke-width="1"/>
          <line x1="0" y1="78" x2="0" y2="32" stroke="rgba(44,31,46,0.2)" stroke-width="1"/>
          <line x1="-78" y1="0" x2="-32" y2="0" stroke="rgba(44,31,46,0.2)" stroke-width="1"/>

          <text class="season-group-label" x="50" y="-82">Spring</text>
          <text class="season-group-label" x="50" y="88">Summer</text>
          <text class="season-group-label" x="-50" y="88">Autumn</text>
          <text class="season-group-label" x="-50" y="-82">Winter</text>

          <text class="seg-label" id="lbl-0" x="14" y="-52">BS</text>
          <text class="seg-label" id="lbl-1" x="42" y="-34">TS</text>
          <text class="seg-label" id="lbl-2" x="52" y="-8">LS</text>
          <text class="seg-label" id="lbl-3" x="52" y="18">LSu</text>
          <text class="seg-label" id="lbl-4" x="38" y="42">TSu</text>
          <text class="seg-label" id="lbl-5" x="12" y="54">SSu</text>
          <text class="seg-label" id="lbl-6" x="-16" y="54">SA</text>
          <text class="seg-label" id="lbl-7" x="-40" y="40">TA</text>
          <text class="seg-label" id="lbl-8" x="-54" y="14">DA</text>
          <text class="seg-label" id="lbl-9" x="-54" y="-12">DW</text>
          <text class="seg-label" id="lbl-10" x="-40" y="-38">TW</text>
          <text class="seg-label" id="lbl-11" x="-14" y="-52">BW</text>

          <circle id="wheel-center" cx="0" cy="0" r="30" fill="#fdf8f5" stroke="rgba(242,196,206,0.6)" stroke-width="1"/>
          <text id="center-line1" x="0" y="-4" class="center-text">Your</text>
          <text id="center-line2" x="0" y="9" class="center-text">Season</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
